name: Fork release CI
on:
  push:
    branches: ['fix/win11-vertical-taskbar-1.86.1']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lite:
    if: github.repository == 'ghjkllasdf-fake/TrafficMonitor'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86, ARM64EC]
        edition: [Lite]
        include:
          - architecture: x64
            edition: Full
          - architecture: x86
            edition: Full
    steps:
      - name: Preserve repository bytes for exact source audit
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Verify exact patch and versions
        run: node build/verify-source.mjs
      - name: Audit self-tests
        run: |
          node build/audit.mjs self-test
          if ($LASTEXITCODE -ne 0) { throw 'Audit self-tests failed' }
          node build/normalize-vendor-paths.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PE normalization tests failed' }
      - name: Clean build, binary audit and portable ZIP
        shell: powershell
        run: ./build/build-release.ps1 -Architecture '${{ matrix.architecture }}' -Edition '${{ matrix.edition }}'
      - name: Isolated portable runtime smoke test
        if: matrix.architecture != 'ARM64EC'
        shell: powershell
        run: ./build/smoke-release.ps1 -Architecture '${{ matrix.architecture }}' -Edition '${{ matrix.edition }}'
      - name: Upload verified distribution only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TrafficMonitor-1.86.1-${{ matrix.architecture }}-${{ matrix.edition }}
          path: |
            dist/TrafficMonitor_V1.86.1_*.zip
            dist/TrafficMonitor_V1.86.1_*.zip.sha256
            dist/TrafficMonitor_V1.86.1_*.zip.smoke.json
          if-no-files-found: error
          retention-days: 14
